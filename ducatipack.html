<!DOCTYPE html>
<html lang="en">
    <head>
        <script>
            (function () {
                try {
                    var t = localStorage.getItem('theme');
                    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
                } catch (e) {}
            })();
        </script>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>maaz.</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="preconnect" href="https://kit.fontawesome.com">
        <link rel="preconnect" href="https://ka-f.fontawesome.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap">
        <link rel="stylesheet" href="shared.css">
        <link rel="stylesheet" href="productinfo.css">
        <script src="app.js" defer></script>
        <script src="cart.js" defer></script>
        <script src="https://kit.fontawesome.com/ceed7b02ce.js" crossorigin="anonymous" defer></script>
    </head>
<body>
    <div class = "hidden">
        <header class="header">
            <a href="index.html" class="logo">maaz.</a>
            <nav class="navbar">
                <a href="index.html">home</a>
                <a href="store.html">store</a>
            </nav>
            <div class="header-actions">
                <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="true">
                    <span class="theme-toggle-track">
                        <i class="fas fa-sun theme-toggle-icon theme-toggle-icon--sun" aria-hidden="true"></i>
                        <i class="fas fa-moon theme-toggle-icon theme-toggle-icon--moon" aria-hidden="true"></i>
                        <span class="theme-toggle-thumb" aria-hidden="true">
                        <i class="fas fa-sun theme-toggle-thumb-icon theme-toggle-thumb-icon--sun"></i>
                        <i class="fas fa-moon theme-toggle-thumb-icon theme-toggle-thumb-icon--moon"></i>
                    </span>
                    </span>
                </button>
                <a href="cart.html" class="cart-link" id="cart-icon-link" aria-label="Open cart">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cart-count" hidden>0</span>
                </a>
            </div>
        </header>
    </div>

    <main class="product-page">
            <div class = "product-image">
                <img src="assets/ducatis.jpg" width="1920" height="1080" alt="Wallpaper Pack">
            </div>

            <div class="product-container">    
                <div class="product-details">
                    <div class="category">3D Model</div>
                    <h2>Stylized Ducati Panigale V4</h2>
                    <div class="price">
                        <span class="original-price">$49.99</span>
                        <span class="discounted-price">$40.99</span>
                    </div>
                    <p>The images presented are original artworks. They serve as placeholders and are not intended for use as standalone images in a real product store.</p>
                    <a href = "cart.html">
                            <button class="add-to-cart-btn" data-id="2" data-name="Stylized Ducati Panigale V4" data-price="40.99" data-image="assets/ducati.jpg">Add to Cart - $40.99</button>
                    </a>
                </div>
            </div>
    </main>

        <footer>
            <div class="hidden">
               <div class="footer-content">
                    <div class="social-media-icons">
                        <i class="fab fa-instagram"></i>
                        <i class="fa-brands fa-x-twitter"></i>
                        <i class="fa-brands fa-discord"></i>
                    </div>
                    <div class="footer-bottom">
                        <p>&copy; <span id="year"></span> Maaz Syed. All Rights Reserved.</p>
                    </div>
                </div>
            </div>
        </footer>
</body>
</html>
