<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maaz.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://kit.fontawesome.com">
    <link rel="preconnect" href="https://ka-f.fontawesome.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="checkout.css">
    <script src="app.js" defer></script>
    <script src="https://kit.fontawesome.com/ceed7b02ce.js" crossorigin="anonymous" defer></script>
    <script src="cart.js" defer></script>
</head>
<body class="checkout-page">
    <div class="checkout-viewport">
        <div class="hidden">
            <header class="header">
                <a href="index.html" class="logo">maaz.</a>
                <nav class="navbar">
                    <a href="index.html">home</a>
                    <a href="store.html">store</a>
                </nav>
                <div class="header-actions">
                    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="true">
                        <span class="theme-toggle-track">
                            <i class="fas fa-sun theme-toggle-icon theme-toggle-icon--sun" aria-hidden="true"></i>
                            <i class="fas fa-moon theme-toggle-icon theme-toggle-icon--moon" aria-hidden="true"></i>
                            <span class="theme-toggle-thumb" aria-hidden="true"></span>
                        </span>
                    </button>
                    <a href="cart.html" class="cart-link" id="cart-icon-link" aria-label="Open cart">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cart-count" hidden>0</span>
                </a>
                </div>
            </header>
        </div>

        <main class="checkout-layout">
            <section class="payment-section">
                <p class="section-label">Express checkout</p>
                <div class="express-checkout">
                    <button class="express-btn shop-pay">Shop Pay</button>
                    <button class="express-btn paypal">PayPal</button>
                    <button class="express-btn google-pay">Google Pay</button>
                </div>

                <div class="or-divider"><span>OR</span></div>

                <div class="contact-info">
                    <div class="section-header">
                        <label for="email">Contact</label>
                        <a href="#" class="section-link">Sign in</a>
                    </div>
                    <input type="email" id="email" placeholder="Email">
                </div>

                <div class="payment-info">
                    <label>Payment</label>
                    <p class="section-subtext">All transactions are secure and encrypted.</p>
                    <div class="card-fields">
                        <input type="text" placeholder="Card number">
                        <div class="card-row">
                            <input type="text" placeholder="Expiration date (MM / YY)">
                            <input type="text" placeholder="Security code">
                        </div>
                        <input type="text" placeholder="Name on card">
                    </div>
                </div>
            </section>

            <aside class="order-summary">
                <div class="total-amount">
                    <p>Total</p>
                    <p class="price">$0.00</p>
                </div>
            </aside>
        </main>
    </div>

    <footer>
        <div class="hidden">
            <div class="footer-content">
                <div class="social-media-icons">
                    <i class="fab fa-instagram"></i>
                    <i class="fa-brands fa-x-twitter"></i>
                    <i class="fa-brands fa-discord"></i>
                </div>
                <div class="footer-bottom">
                    <p>&copy; <span id="year"></span> Maaz Syed. All Rights Reserved.</p>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
